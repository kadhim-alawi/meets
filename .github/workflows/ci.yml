name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
      - name: Core
        working-directory: packages/meets_core
        run: dart pub get && dart analyze && dart test
      - name: Server
        working-directory: server
        run: dart pub get && dart analyze && dart test
      - name: App
        working-directory: app
        run: flutter pub get && flutter analyze && flutter test && flutter build web --release --no-web-resources-cdn
