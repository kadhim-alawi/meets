# Render blueprint: New + > Blueprint > pick this repo. Set the secrets in the dashboard.
services:
  - type: web
    name: meets
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: QLOO_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: QLOO_BASE_URL
        value: https://hackathon.api.qloo.com
      - key: PUBLIC_URL
        sync: false
      - key: LLM_MODEL
        value: claude-opus-5-5
    disk:
      name: meets-data
      mountPath: /srv/data
      sizeGB: 1
